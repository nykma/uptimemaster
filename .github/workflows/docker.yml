name: Build Docker Images

on:
  push:
    branches: [master]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: x86_64
            nix_system: x86_64-linux
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: aarch64
            nix_system: aarch64-linux

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build Docker image
        run: nix build .#packages.${{ matrix.nix_system }}.docker-image --accept-flake-config

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-${{ matrix.tag_suffix }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}-${{ matrix.tag_suffix }}

      - name: Load image into Docker
        run: docker load < result

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          while IFS= read -r tag; do
            docker tag uptimemaster:latest "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
